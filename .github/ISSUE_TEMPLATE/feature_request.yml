name: ✨ 功能建议
description: 希望支持新平台、新搜索源、新的输出方式
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请看 README 的「平台限制」章节 —— 有些平台是**技术上做不到**，
        不是没做。已经验证过不可行的方案列在那里，避免重复投入。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是直接给方案
      placeholder: 我经常需要找某个技术话题的高质量视频，但现在要换三个网站手动搜…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 新平台
        - 搜索质量 / 排序
        - 结果输出格式
        - 与其他工具集成
        - 性能
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我看了 README 的「平台限制」，确认这不是已验证不可行的方向
          required: true
        - label: 我已搜索过已有 issue
          required: true
